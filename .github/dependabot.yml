version: 2
updates:
  - package-ecosystem: nuget
    directory: /source
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # NUnit 4.4+ needs a newer C# compiler than the .NET 8 SDK provides (see AvalonDockTest.csproj).
      - dependency-name: "NUnit"
        versions: [">=4.4.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
